[project]
name = "re1sid-lib"
version = "0.4.0"
description = "A small Python library for working with ReVanced CLI and patch bundles. It provides helpers to download required ReVanced assets and to patch APK files programmatically."
readme = "README.md"
license = { text = "Apache-2.0 license" }
authors = [
    { name = "09u2h4n", email = "09u2h4n.y1lm42@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pyaxmlparser>=0.3.31",
    "textual>=8.2.8",
]


all = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pyaxmlparser>=0.3.31",
    "textual>=8.2.8"
]

[project.urls]
homepage = "https://github.com/09u2h4n/re1sid-lib"
repository = "https://github.com/09u2h4n/re1sid-lib"
documentation = "https://github.com/09u2h4n/re1sid-lib#readme"

[project.scripts]
re1sid-lib = "re1sid_lib.tui:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
